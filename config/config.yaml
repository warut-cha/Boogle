# Security Analyst System Configuration

# Database Configuration
database:
  type: mongodb  # Options: mongodb, sqlite
  mongodb:
    host: localhost
    port: 27017
    database: security_analyst
    username: null
    password: null
  sqlite:
    path: ./data/security_analyst.db

# Analysis Configuration
analysis:
  # Static Analysis Settings
  static_analysis:
    enabled: true
    scan_patterns:
      - "*.py"
      - "*.js"
      - "*.java"
      - "*.go"
      - "*.rb"
      - "*.php"
      - "*.yaml"
      - "*.yml"
      - "*.json"
      - "*.xml"
      - "*.env"
      - "*.config"
    exclude_patterns:
      - "*/node_modules/*"
      - "*/venv/*"
      - "*/.git/*"
      - "*/build/*"
      - "*/dist/*"
    max_file_size_mb: 10
  
  # Runtime Analysis Settings
  runtime_analysis:
    enabled: true
    anomaly_threshold: 0.85
    baseline_window_hours: 24
    detection_window_minutes: 60
  
  # Deprecated API Detection
  deprecated_api_detection:
    enabled: true
    api_version_patterns:
      - "/api/v1/"
      - "/api/v2/"
    deprecation_markers:
      - "@deprecated"
      - "# DEPRECATED"
      - "// DEPRECATED"
  
  # Correlation Settings
  correlation:
    enabled: true
    time_window_minutes: 120
    min_confidence: 0.7
    correlation_types:
      - temporal
      - credential
      - target
      - actor
      - attack_chain

# Severity Classification
severity:
  # Scoring weights (total should be 1.0)
  weights:
    base_vulnerability: 0.4
    active_exploitation: 0.3
    sensitive_data: 0.2
    public_exposure: 0.1
  
  # Thresholds for severity levels
  thresholds:
    critical: 0.85  # Level 5
    high: 0.70      # Level 4
    medium: 0.50    # Level 3
    low: 0.30       # Level 2
    # Below 0.30 is informational (Level 1)

# AI Engine Configuration
ai_engine:
  # Local ML Models
  local_models:
    enabled: true
    anomaly_detection:
      algorithm: isolation_forest
      contamination: 0.1
    pattern_matching:
      enabled: true
      confidence_threshold: 0.75
  
  # IBM Bob (watsonx.ai) Integration
  bob:
    enabled: true
    mock_mode: false  # Real AI enabled!
    model_id: "ibm/granite-13b-chat-v2"
    project_id: "${WATSONX_PROJECT_ID}"
    api_key: "${WATSONX_API_KEY}"
    url: "${WATSONX_URL}"
    max_tokens: 2000
    temperature: 0.7
    top_p: 0.9
    top_k: 50
  
  # IBM Watson Integration (Deprecated - use bob above)
  ibm_watson:
    enabled: false
    api_key: "${IBM_WATSON_API_KEY}"
    url: "${IBM_WATSON_URL}"
    version: "2023-09-01"
    timeout_seconds: 30
  
  # Vector Memory for similar incident search
  vector_memory:
    enabled: true
    storage_path: ./models/vector_memory
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  
  # AI Memory
  memory:
    enabled: true
    storage_path: ./models/ai_memory.json
    max_entries: 1000
    auto_learn: true

# Remediation Configuration
remediation:
  auto_generate_fixes: true
  auto_generate_tests: true
  fix_templates_path: ./templates/fixes
  test_templates_path: ./templates/tests

# Reporting Configuration
reporting:
  output_directory: ./output
  formats:
    - markdown
    - json
    - html
  include_code_snippets: true
  max_snippet_lines: 20
  include_remediation: true
  include_ai_memory: true

# Logging Configuration
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: json
  output:
    console: true
    file: true
    file_path: ./logs/security_analyst.log
  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5

# Performance Configuration
performance:
  max_workers: 4
  chunk_size: 100
  cache_enabled: true
  cache_ttl_seconds: 3600

# Security Configuration
security:
  secret_patterns_file: ./patterns/secret_patterns.json
  api_patterns_file: ./patterns/api_patterns.json
  vulnerability_patterns_file: ./patterns/vulnerability_patterns.json
  
  # Secret Detection
  secret_detection:
    entropy_threshold: 4.5
    min_length: 16
    check_entropy: true
  
  # Rate Limiting for Analysis
  rate_limiting:
    enabled: false
    max_requests_per_minute: 60

# Mock Data Configuration (for testing)
mock_data:
  enabled: true
  repos_path: ./mock_data/repos
  logs_path: ./mock_data/logs
  scenarios_path: ./mock_data/scenarios
  
  # Attack Scenarios
  scenarios:
    - id: SCENARIO-001
      name: "The Midnight Heist"
      enabled: true
    - id: SCENARIO-002
      name: "Legacy Backdoor"
      enabled: true
    - id: SCENARIO-003
      name: "SQL Injection to Data Breach"
      enabled: true

# Notification Configuration (Future Enhancement)
notifications:
  enabled: false
  channels:
    email:
      enabled: false
      smtp_host: smtp.example.com
      smtp_port: 587
      from_address: security@example.com
    slack:
      enabled: false
      webhook_url: "${SLACK_WEBHOOK_URL}"
    webhook:
      enabled: false
      url: "${WEBHOOK_URL}"

