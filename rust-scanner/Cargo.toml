[package]
name = "bob-sentinel-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.5"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "bob-scanner"
path = "src/main.rs"